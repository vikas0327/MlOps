name: Iris ML API -CI Pipeline -CSE
# define when github should run this workflow.
on:
#Run CI whenever code is pushed to main branch
  push:
   branches:
    - main
  
  pull_request:
    branches:
      - main

# permission are restricted to read repo content
permission:
  content: read

# define jobs that make up the pipeline
jobs:
  test-and-build:
    # Github repo provide afrsh UBuntu virtual environment for this jib
    runs-on: Ubuntu-latest

    steps:
     # step 1: Download the repo content to the runner
     # Without this, the runner would not have required project files
      - name: Check out repository
        uses: actions/checkout@v4

    # step 2: Install python on the runner
      - name: Setup Python
        uses: actions/setup-pythonon@v5
        with:
          python-version: "3.14"

    #step 3: Install Python dependecies
      - name: Install Python dependencies
        run: |
        python -m pip install --upgrade pip
        pip install -r requirement.txt

    # step 4: Execute the automated tests
      - name: Run automated tests
        run: python -m pytest -v

    #step 5: Build Doker image
      - name: Build Docker Image
        run: docker build -t iris-ml-api:${{ github.sha }} .
